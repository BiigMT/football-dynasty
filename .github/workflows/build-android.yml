name: Build Football Dynasty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Claude project
        run: |
          mkdir -p /tmp/claude_game
          unzip -o claude_version/football_dynasty_fixed.zip -d /tmp/claude_game
          find /tmp/claude_game -name pubspec.yaml -print

      - name: Locate Flutter project
        run: |
          PROJECT=$(find /tmp/claude_game -name pubspec.yaml -print -quit)
          test -n "$PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Apply Football Dynasty v2 updates
        run: |
          test -d "$GITHUB_WORKSPACE/v2_overlay"
          cp -R "$GITHUB_WORKSPACE/v2_overlay/." "$PROJECT_DIR/"
          python3 "$GITHUB_WORKSPACE/scripts/patch_transfer_listing.py" "$PROJECT_DIR"
          echo "Applied Football Dynasty v2 updates to $PROJECT_DIR"

      - name: Upload extracted source for development
        uses: actions/upload-artifact@v4
        with:
          name: football-dynasty-source-v2
          path: ${{ env.PROJECT_DIR }}
          retention-days: 7

      - name: Generate Android project files
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create --platforms=android .

      - name: Force portrait orientation in Android manifest
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android:screenOrientation="portrait"' not in s:
              s = s.replace("<activity", '<activity android:screenOrientation="portrait"', 1)
          p.write_text(s)
          print("Android activity locked to portrait.")
          PY

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-dynasty-apk-v2
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
