
name: Build Football Dynasty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Claude project
        run: |
          mkdir -p /tmp/claude_game
          unzip -o claude_version/football_dynasty_fixed.zip -d /tmp/claude_game
          find /tmp/claude_game -name pubspec.yaml -print

      - name: Locate Flutter project
        run: |
          PROJECT=$(find /tmp/claude_game -name pubspec.yaml -print -quit)
          test -n "$PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-dynasty-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
